name: Lynx Renamer
description: Build filenames and destination folders with guided settings. Preview a scene without saving settings or modifying files. Existing rules are preserved.
version: 1.1.1
settings: {}
ui:
  javascript:
  - LynxRenamer.js
  css:
  - LynxRenamer.css
  assets:
    /: .
tasks:
- name: Enable automatic renaming
  description: Process scenes when they are updated, using the saved rules and dry-run setting. Preview first; live mode can rename or move media files.
  defaultArgs:
    mode: enable
- name: Disable automatic renaming
  description: Stop automatic processing on scene updates. Explicit library tasks remain available.
  defaultArgs:
    mode: disable
- name: Toggle dry-run
  description: Toggle preview-only mode. Turning dry-run off permits actual file changes when automatic processing or a library task runs.
  defaultArgs:
    mode: dryrun
- name: Rename all scenes
  description: Process the library with saved rules. Dry-run on previews only; dry-run off can rename and move files. Preview a single scene in the panel first.
  defaultArgs:
    mode: bulk
exec:
- python
- '{pluginDir}/LynxRenamer.py'
interface: raw
hooks:
- name: lynx_rename_on_update
  description: Rename or move a file when its scene is updated.
  triggeredBy:
  - Scene.Update.Post
