name: Publish Lynx Stash sources

on:
  push:
    branches: [main]
    paths:
      - "themes/**"
      - "plugins/**"
      - "scrapers/**"
      - "scripts/**"
      - ".github/workflows/publish-stash-sources.yml"
  pull_request:
    paths:
      - "themes/**"
      - "plugins/**"
      - "scrapers/**"
      - "scripts/**"
      - ".github/workflows/publish-stash-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lynx-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install -r scripts/requirements-build.txt
      - name: Test package builder
        run: python -B -m unittest discover -s scripts -p "test_*.py" -v
      - name: Build and validate both sources
        run: python -B scripts/build_packages.py --output _site
      - name: Test index and ZIP downloads over local HTTP
        run: python -B scripts/verify_http.py --directory _site
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy installation sources
        id: deployment
        uses: actions/deploy-pages@v5
