name: Lynx Scene Card
description: Custom scene titles, performer and tag chips, compact overflow lists and portrait previews for Stash. Designed to complement Lynx Theme.
version: 0.1.9
ui:
  javascript:
    - LynxSceneCard.js
  css:
    - LynxSceneCard.css
  assets:
    /: .
settings:
  EnableFooter:
    displayName: Enable Footer
    description: Show the studio name, view count and scene date below the title. Refresh the page after changing card options.
    type: BOOLEAN
  EnablePerformerList:
    displayName: Show Performer Chips
    description: Show linked performer names with portrait previews. More than two performers are collected in an overflow popup.
    type: BOOLEAN
  EnableTagChips:
    displayName: Show Tag Chips
    description: Show linked tags below the title. More than two tags are collected in an overflow popup.
    type: BOOLEAN
  ShowStudioOverlay:
    displayName: Show Studio Overlay
    description: Show Stash's studio logo overlay on the scene thumbnail.
    type: BOOLEAN
  ShowSceneSpecsOverlay:
    displayName: Show Scene Specs Overlay
    description: Show Stash's scene specifications overlay on the thumbnail.
    type: BOOLEAN
  ShowSceneInteractiveSpeedOverlay:
    displayName: Show Interactive Speed Overlay
    description: Show Stash's interactive-speed overlay when interactive metadata is available.
    type: BOOLEAN
  ShowProgressBar:
    displayName: Show Progress Bar
    description: Show the scene-card progress bar. This option does not affect progress indicators elsewhere in Stash.
    type: BOOLEAN
  ShowHoverScrubber:
    displayName: Show Hover Scrubber
    description: Show Stash's scene-card hover scrubber when preview assets are available.
    type: BOOLEAN
  ShowHoverScrubberIndicator:
    displayName: Show Hover Scrubber Indicator
    description: Show Stash's position indicator for the scene-card hover scrubber.
    type: BOOLEAN
