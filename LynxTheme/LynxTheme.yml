name: LynxTheme
description: Modular dark glass theme for Stash with responsive navigation, cards, filters, details and player styling.
version: 0.2.10
ui:
  assets:
    /: .
  javascript:
    - lynx-theme.js
    - performer-details.js
  css:
    - css/tokens.css
    - css/navbar.css
    - css/cards.css
    - css/filters.css
    - css/list-views.css
    - css/scene-player.css
    - css/details.css
    - css/components.css
    - css/buttons.css
    - css/badges.css
    - css/utilities.css
    - css/responsive.css
    - css/scroll-performance.css
    - css/user-design.css
    - css/settings-controls.css
    - css/performer-details.css
settings:
  accent:
    displayName: Accent colour
    description: Choose the accent used by LynxTheme.
    type: STRING
